plugins {
    id 'com.android.application'
}

android {
    namespace 'app.telegramws.proxy'
    compileSdk 35

    defaultConfig {
        applicationId 'app.telegramws.proxy'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.2.5'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
